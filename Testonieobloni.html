<!DOCTYPE html>
<head>
    <title>Blablasoasidaosiccutotrio</title>

    <style>
        body{
            background-color: black;
            display:grid;
            justify-content: center;
            align-content: center;
            box-sizing: border-box;
            height: 100vh;
            margin: 0;
        }

        div{
            background-color: darkslategray;
            transition: linear 1s;
        }
    </style>
</head>
<body>
    <script>

        class Square {
            constructor(size,rotation = 0){
                this.size = size;
                this.rotation = rotation;
                this.object = document.createElement("div");
                this.object.style.width = size + "px";
                this.object.style.height = size + "px";
                this.timerOn = false;
                this.selected = false;
            }

            toggle(){
                this.selected = !this.selected;
                if (this.selected) {
                    this.object.style.backgroundColor = "rgb(81, 160, 160)";
                } else {
                    this.object.style.backgroundColor = "darkslategray";
                }
            }
            
            toggleColor(color){
                this.selected = !this.selected;
                if (this.selected) {
                    this.object.style.backgroundColor = color;
                } else {
                    this.object.style.backgroundColor = "darkslategray";
                }
            }

            async rotate(deg){
                this.rotation += deg;
                this.object.style.rotate = this.rotation + "deg";
                this.toggle();
                await delay(500);
                this.toggle();
            }

            async rotateAndFix(deg,transitionTime){
                this.object.style.transition = `linear ${transitionTime}ms`;
                this.rotation += deg;
                this.object.style.rotate = this.rotation + "deg";
                this.toggle();
                await delay(transitionTime/2);
                this.toggle();
                await delay(transitionTime/2);
                this.object.style.transition = "linear 1s";
            }

            async lightAndFix(transitionTime){
                this.object.style.transition = `linear ${transitionTime}ms`;
                this.toggle();
                await delay(transitionTime);
                this.toggle();
                await delay(transitionTime);
                this.object.style.transition = "linear 1s";
            }
            
            async lightAndFixPlusRandom(transitionTime,color){
                this.object.style.transition = `linear ${transitionTime}ms`;
                this.toggleColor(color);
                await delay(transitionTime);
                this.toggle();
                await delay(transitionTime);
                this.object.style.transition = "linear 1s";
            }

            timer(time = 1000,times = 0){
                if (this.timerOn) return this.timerOn = !this.timerOn;
                this.timerOn = !this.timerOn;

                let timesGone = 0;
                const timer = setInterval(() => {
                    timesGone ++;
                    if (!this.timerOn || timesGone == times) return clearInterval(timer);
                    this.rotation += 90;
                    this.object.style.rotate = this.rotation + "deg";

                },time);
            }
        }

        let grid =  [[]];

        alert("press any key in the top row (numbers row) to do something also if you add ?pos=(number) it will set how big the grrid is ");

        const amount = Number((new URLSearchParams(window.location.search)).get("pos") ?? 20);

        buildGrid(amount);

        document.addEventListener("keyup", async (info) => {
            console.log(info.key);
            switch (info.key) {
                case "`":
                    const baseColor1 = randomColorArray();
                    const endColor1 = randomColorArray();
                    for (let x = 0;x < grid[0].length;x++){
                        for (let y = 0;y < grid.length;y++){
                            let color = smoothColor(baseColor1,endColor1,(y - x + 0.0)/grid.length);
                            grid[x][y].toggleColor(`rgb(${color[0]},${color[1]},${color[2]})`);
                        }
                        await delay(250);
                    }
                    break;
                case "1":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].toggle();
                        }
                    }
                    break;
                case "2":
                    for (let y = 0;y < grid.length;y+=2){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].toggle();
                            await delay(50);
                        }
                        for (let x = grid[0].length-1;x >= 0;x--){
                            grid[y+1][x].toggle();
                            await delay(50);
                        }
                    }
                    break;
                case "3":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].toggle();
                            await delay(50);
                        }
                        for (let x = grid[0].length-1;x > 0;x--){
                            grid[y][x].toggle();
                            await delay(50);
                        }
                    }
                    break;
                case "4":
                    for (let y = 0;y < grid.length;y+=2){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].rotate(360);
                            await delay(5);
                        }
                        for (let x = grid[0].length-1;x >= 0;x--){
                            grid[y+1][x].rotate(360);
                            await delay(5);
                        }
                    }
                    break;
                case "5":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].toggle();
                            grid[y][x].rotate(360);
                        }
                    }
                    break;
                case "6":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].rotateAndFix(360,(Math.floor(Math.random()*1500 + 250)));
                        }
                    }
                    break;
                case "7":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].lightAndFix((Math.floor(Math.random()*1500 + 250)));
                        }
                    }
                    break;
                case "8":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].lightAndFixPlusRandom((Math.floor(Math.random()*1500 + 250)),randomColor());
                        }
                    }
                    break;
                case "9":
                    for (let d = 0;d < grid.length;d++){
                        grid[d][d].toggle();
                        await delay(50); 
                        findBothSides(d);
                    }
                    break;
                case "0":
                    for (let y = 0;y < grid.length;y++){
                        for (let x = 0;x < grid[0].length;x++){
                            grid[y][x].toggleColor(randomColor());
                        }
                    }
                    break;
                case "-":
                    const baseColor2 = randomColorArray();
                    const endColor2 = randomColorArray();
                    for (let x = 0;x < grid[0].length;x++){
                        for (let y = 0;y < grid.length;y++){
                            let color = smoothColor(baseColor2,endColor2,(x + 0.0)/grid.length);
                            grid[x][y].toggleColor(`rgb(${color[0]},${color[1]},${color[2]})`);
                        }
                        await delay(250);
                    }
                    break;
                case "=":
                    const topLeft1 = randomColorArray();
                    const topRight1 = randomColorArray();
                    const bottomLeft1 = randomColorArray();
                    const bottomRight1 = randomColorArray();
                    for (let x = 0;x < grid[0].length;x++){
                        for (let y = 0;y < grid.length;y++){
                            let topColors = smoothColor(topLeft1,topRight1,(x + 0.0)/grid.length);
                            let bottomColors = smoothColor(bottomLeft1,bottomRight1,(x + 0.0)/grid.length);
                            let fullColor = smoothColor(topColors,bottomColors,(y + 0.0)/grid.length);
                            grid[x][y].toggleColor(`rgb(${fullColor[0]},${fullColor[1]},${fullColor[2]})`);
                        }
                    }
                    break;
                case "Backspace":
                    const topLeft2 = [255,255,255]
                    const topRight2 = randomColorArray();
                    const bottomLeft2 = topRight2;
                    const bottomRight2 = [0,0,0]
                    for (let x = 0;x < grid[0].length;x++){
                        for (let y = 0;y < grid.length;y++){
                            let topColors = smoothColor(topLeft2,topRight2,(x + 0.0)/grid.length);
                            let bottomColors = smoothColor(bottomLeft2,bottomRight2,(x + 0.0)/grid.length);
                            let fullColor = smoothColor(topColors,bottomColors,(y + 0.0)/grid.length);
                            grid[x][y].toggleColor(`rgb(${fullColor[0]},${fullColor[1]},${fullColor[2]})`);
                        }
                    }
                    break;
            }

        })

        function buildGrid(amount){
            const gap = (window.innerHeight * 0.9 / amount / 10);
            const size = Math.floor((window.innerHeight - (amount - 1) * gap - 4 * gap) / amount);
            document.body.style.gridTemplateColumns = `repeat(${amount}, ${size}px)`;
            document.body.style.gridTemplateRows = `repeat(${amount}, ${size}px)`;
            document.body.style.gap = gap + "px";
            document.body.style.padding = gap * 2 + "px";
            for (let y = 0; y < amount;y++){
                for (let x = 0; x < amount;x++){
                    let square = new Square(size);
                    grid[y].push(square);
                    document.body.appendChild(square.object);
                }
                if (y + 1 < amount) grid.push([]);
            }
        }

        function delay(time) {
            return new Promise(resolve => setTimeout(resolve, time));
        }

        async function findBothSides(pos){
            for (let i = pos + 1; i < grid.length;i++){
                let color = smoothColor([81,160,160],[255,0,0],(i - pos + 0.0)/grid.length);
                grid[pos][i].toggleColor(`rgb(${color[0]},${color[1]},${color[2]})`);
                grid[i][pos].toggleColor(`rgb(${color[0]},${color[1]},${color[2]})`);
                await delay(200);
            }
        }

        function smoothColor(startColor,endColor,time){
            return [
                (startColor[0] + (endColor[0] - startColor[0]) * time),
                (startColor[1] + (endColor[1] - startColor[1]) * time),
                (startColor[2] + (endColor[2] - startColor[2]) * time)
            ]
        }

        function randomColor(){
            return `rgb(${(Math.floor(Math.random()*255))},${(Math.floor(Math.random()*255))},${(Math.floor(Math.random()*255))})`
        }

        function randomColorArray(){
            return [(Math.floor(Math.random()*255)),(Math.floor(Math.random()*255)),(Math.floor(Math.random()*255))];
        }

    </script>
</body>
